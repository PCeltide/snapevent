[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kdp-data"
version = "0.2.1"
description = "Dataset index + Polars loaders for kdp-processed Kalshi market data"
license = "MIT OR Apache-2.0"
requires-python = ">=3.11"
dependencies = ["polars>=1.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/kdp_data"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
