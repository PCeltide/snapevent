[package]
name = "kdp-process"
description = "Offline processor: capture JSONL -> compressed columnar Parquet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
name = "kdp-process"
path = "src/main.rs"

[dependencies]
kdp-core.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Columnar output (Phase 3): arrow builds the RecordBatch; parquet writes it
# (ZSTD). Feather (Arrow IPC) reuses the same batch via arrow's `ipc` feature.
arrow.workspace = true
parquet.workspace = true
